server:
  port: 8080
spring:
  application:
    name: reservation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/volthub}
    username: ${DB_USER:reservation_user}
    password: ${DB_PASSWORD:reservation_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: reservation
  flyway:
    schemas: reservation
    default-schema: reservation
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  threads:
    virtual:
      enabled: true

volthub:
  reservation:
    hold-minutes: ${RESERVATION_HOLD_MINUTES:10}
  outbox:
    poll-ms: 500
  station-service:
    url: ${STATION_SERVICE_URL:http://localhost:8001}
  oidc:
    issuer: ${OIDC_ISSUER:http://localhost:8081/realms/volthub}
    jwks-uri: ${OIDC_JWKS_URI:http://localhost:8081/realms/volthub/protocol/openid-connect/certs}
    token-uri: ${OIDC_TOKEN_URI:http://localhost:8081/realms/volthub/protocol/openid-connect/token}
    client-id: ${OIDC_CLIENT_ID:reservation-service}
    client-secret: ${OIDC_CLIENT_SECRET:}
    audiences: bff-web

resilience4j:
  circuitbreaker:
    instances:
      station-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      station-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-} span=%X{span_id:-}]"
