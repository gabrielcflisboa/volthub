# Feature 1 — lista consumindo API real (BFF VoltHub; sem BFF cai no seed local)
appId: com.volthub.mobile
---
- launchApp
# o app abre na aba Mapa (rota "/"); a lista fica na aba Estações
- tapOn:
    id: "tab-stations"
- extendedWaitUntil:
    visible:
      id: "item-list-screen"
    timeout: 30000
- assertVisible:
    id: "item-card-volthub-savassi"
- scrollUntilVisible:
    element:
      id: "item-card-volthub-floresta"
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: "item-card-volthub-floresta"
