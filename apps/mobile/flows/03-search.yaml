# Feature 3 — busca por texto (client-side)
appId: com.volthub.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "item-list-screen"
    timeout: 30000
- tapOn:
    id: "search-input"
- inputText: "pampulha"
- assertVisible:
    id: "item-card-volthub-pampulha"
- assertNotVisible:
    id: "item-card-volthub-savassi"
