# Feature 2 — navegação lista → detalhe
appId: com.volthub.mobile
---
- launchApp
# o app abre na aba Mapa (rota "/"); a lista fica na aba Estações
- tapOn:
    id: "tab-stations"
- extendedWaitUntil:
    visible:
      id: "item-list-screen"
    timeout: 30000
- tapOn:
    id: "item-card-volthub-savassi"
- assertVisible:
    id: "detail-screen"
- assertVisible:
    id: "detail-title"
- assertVisible: "VoltHub Savassi"
