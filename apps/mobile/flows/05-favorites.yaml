# Feature 5 — favoritos persistidos localmente
appId: com.volthub.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "item-list-screen"
    timeout: 30000
- tapOn:
    id: "item-card-volthub-savassi"
- assertVisible:
    id: "detail-screen"
- tapOn:
    id: "detail-favorite-button"
- tapOn:
    id: "detail-back-button"
- tapOn:
    id: "tab-favorites"
- assertVisible:
    id: "favorite-item-volthub-savassi"
